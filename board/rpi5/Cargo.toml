[package]
name = "board-rpi5"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Raspberry Pi 5 (BCM2712, 4x Cortex-A76): debug-PL011, GIC-400, PCIe naar de RP1, de GEM, de vaste tabellen."

[dependencies]
dev = { path = "../../dev" }
abi = { path = "../../abi" }
cpu = { path = "../../cpu" }
sync = { path = "../../sync" }
netdev = { path = "../../netdev" }
board = { path = "../../board" }
board-raspi = { path = "../raspi" }
driver-pl011 = { path = "../../driver/pl011" }
driver-gicv2 = { path = "../../driver/gicv2" }
driver-gem = { path = "../../driver/nic/gem" }
driver-mdio = { path = "../../driver/nic/mdio" }
driver-brcmpcie = { path = "../../driver/brcmpcie" }
driver-pcie = { path = "../../driver/pcie" }

[lints]
workspace = true

[features]
default = []
# De VideoCore-framebuffer (board-raspi, vcfb.rs).
gui = ["board-raspi/gui"]
# De twee xHCI's van de RP1 als USB-hosts (usb.rs): de bouwsteen van gui
# en media.
usb = ["board-raspi/usb"]
