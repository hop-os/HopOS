[package]
name = "gui-usbin"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "De USB-invoer naar het glas: toetsen en muis als KVM-JSON naar de houder van de framebuffer-grant. De bus zelf is van de bouwsteen `usb`."

[dependencies]
abi = { path = "../../abi", features = ["gui"] }
bounded = { path = "../../bounded" }
sync = { path = "../../sync" }
driver-hid = { path = "../../driver/usb/hid" }

[lints]
workspace = true
