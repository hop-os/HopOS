# HopOS v3, de config van elke node met glas, een kern met de gui-feature
# (GUI=1 of MEDIA=1): headless.cfg plus de init-jobs, compleet
# (docs/boards.md, "De config"). Een eigen config: dit bestand met je eigen
# regels erachter (cat headfull.cfg eigen.cfg); de laatste waarde van een
# sleutel wint, een herhaalde sleutel (hopos.init[]) telt alle regels. De
# sleutels staan in kern/src/nodecfg.rs.
#
# Geen hopos.node: zonder heet de node naar zijn board en de laatste twee
# bytes van zijn uplink-MAC (rpi4-4c54). Geen plek van Hop: zonder
# hopos.hop.sharegroup en hopos.hop.core-class kiest het board
# (board::Board, HOP_GROUP en HOP_CORE_CLASS).
#
# Open op het eigen LAN: de API zonder sleutel en de console over TCP.
# Voor een node buiten je eigen net: een eigen regel met hopos.apikey en
# hopos.insecure=0.
hopos.cluster=hopos
hopos.insecure=1
hopos.console=1
hopos.cages=on
# Een device begint schoon en vergeet alles: stateless negeert bij een koude
# boot het indexbestand van de schijf. Een node die moet onthouden (de boom
# op de schijf, Hop's staat op /hop/) zet in zijn eigen regels
# hopos.storage=stateful.
hopos.storage=stateless
#
# welcome op poort 80, van de rollende release `apps` (jobs/README.md, het
# naamschema <app>-<arch>.elf).
hopos.init[]={"name":"welcome","driver":"hop","artifacts":[{"url":"https://github.com/xinix00/HopOS/releases/download/apps/welcome-arm64.elf","match":{"node.arch":"arm64"}},{"url":"https://github.com/xinix00/HopOS/releases/download/apps/welcome-riscv64.elf","match":{"node.arch":"riscv64"}}],"memory_limit":33554432,"ports":{"http":80}}
# Het glas aan de display-app (docs/gui.md): haal het hekje weg. Zonder
# deze job blijft de console van de kern op het scherm.
#hopos.init[]={"name":"display","driver":"hop","artifacts":[{"url":"https://github.com/xinix00/HopOS/releases/download/apps/display-arm64.elf","match":{"node.arch":"arm64"}}],"memory_limit":33554432,"env":{"GUI":"display"}}
