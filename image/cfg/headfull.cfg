# HopOS v3, de standaardconfig met glas (headfull: een kern met de
# gui-feature, en media op de O6N). Dezelfde sleutels als headless.cfg, plus
# welcome op poort 80 als init-job. De kern leest hem uit zijn configvenster;
# elke sleutel staat hieronder, de meeste uitgecommentarieerd met een
# voorbeeld: haal het hekje weg om hem aan te zetten.
#
# Eén sleutel=waarde per regel, '#' is commentaar. Je eigen config is dit
# bestand met je eigen regels erachter (cat headfull.cfg eigen.cfg): de
# laatste waarde van een sleutel wint, hopos.init[] telt elke regel. In een
# image of op een kaart: hop image <bestand> --config node.cfg (de hop-repo).
# Alle sleutels: kern/src/nodecfg.rs.

# --- De node ------------------------------------------------------------
# De naam. Zonder: het board en de laatste twee bytes van zijn MAC
# (rpi4-4c54).
#hopos.node=keuken
# Het MAC-adres, alleen op een board zonder eigen MAC (Radxa Zero 3E,
# LicheeRV Nano). Zonder: afgeleid van hopos.node (02:48:4f:50:xx:xx, een
# hash van de naam: dezelfde naam geeft hetzelfde adres). Zonder beide
# 02:48:4f:50:00:01, en dan botst een tweede zo'n board op je LAN.
#hopos.mac=02:48:4f:50:12:34
hopos.cluster=hopos

# --- Toegang --------------------------------------------------------------
# Open op je eigen LAN: de API zonder sleutel, en de console over TCP
# (nc NODE 5555).
hopos.insecure=1
# Dicht, voor een node buiten je eigen net: de API alleen met de sleutel
# (het dashboard en de hop-cli tekenen ermee), en de console dicht.
#hopos.insecure=0
#hopos.apikey=een-lange-geheime-sleutel
# De console over TCP volgt hopos.insecure; los zetten kan ook:
#hopos.console=0

# --- Opslag ---------------------------------------------------------------
# stateless: de node begint bij elke koude boot schoon. stateful: hij
# onthoudt de volumes van zijn apps en de staat van Hop (/hop/) op de schijf.
hopos.storage=stateless
#hopos.storage=stateful

# --- Cores ----------------------------------------------------------------
# Waar de kern (de OS-core) en Hop draaien. Zonder sleutels de standaard van
# het board:
#
#   board            de kern (OS-core)              Hop
#   Raspberry Pi 4   core 0 (vast)                  op de OS-core
#   Raspberry Pi 5   core 0 (vast)                  op de OS-core
#   Radxa Zero 3E    core 0                         op de OS-core
#   Orion O6N        core 0                         een eigen kleine core
#   Ampere Altra     core 0                         een eigen core
#   Mac mini M4      de boot-core                   een eigen kleine core
#   LicheeRV Nano    de C906B, met de apps (vast)   de C906L
#
# De OS-core: small, mid, big (de eerste core van die klasse) of een
# core-nummer.
#hopos.oscore=0
# Hop: system is op de OS-core naast de kern; een andere naam is een eigen
# core, die hij deelt met jobs met dezelfde tag sharegroup. Op de M4 kan
# Hop niet op de OS-core.
#hopos.hop.sharegroup=system
# De klasse van die eigen core, een voorkeur: small, mid of big (alleen op
# een board met klassen, de O6N en de M4).
#hopos.hop.core-class=small

# --- Jobs bij de start ----------------------------------------------------
# Hop plaatst deze jobs bij elke start: per job één regel hopos.init[], een
# jobspec van Hop als JSON-object op één regel (jobs/README.md).
# welcome op poort 80, van de rollende release `apps` (het naamschema
# <app>-<arch>.elf):
hopos.init[]={"name":"welcome","driver":"hop","artifacts":[{"url":"https://github.com/hop-os/HopOS/releases/download/apps/welcome-arm64.elf","match":{"node.arch":"arm64"}},{"url":"https://github.com/hop-os/HopOS/releases/download/apps/welcome-riscv64.elf","match":{"node.arch":"riscv64"}}],"memory_limit":33554432,"ports":{"http":80}}
# Het glas aan de display-app (docs/gui.md); zonder deze job blijft de
# console van de kern op het scherm:
#hopos.init[]={"name":"display","driver":"hop","artifacts":[{"url":"https://github.com/hop-os/HopOS/releases/download/apps/display-arm64.elf","match":{"node.arch":"arm64"}}],"memory_limit":33554432,"env":{"GUI":"display"}}

# --- Een S3-bucket --------------------------------------------------------
# De object-store van de apps; met hopos.lock.type=s3 ook de lock en de
# staat van de cluster.
#hopos.s3.endpoint=https://s3.example.com
#hopos.s3.bucket=mijn-bucket
#hopos.s3.region=eu-west-1
#hopos.s3.key=TOEGANGSSLEUTEL
#hopos.s3.secret=GEHEIM
#hopos.s3.pathstyle=1

# --- Een cluster ----------------------------------------------------------
# Zonder lock is de node standalone, zijn eigen leader. Meer nodes in één
# cluster: de lock in de bucket hierboven, op elke node dezelfde bucket,
# hopos.cluster en hopos.apikey.
#hopos.lock.type=s3
# De lease in seconden (standaard 30):
#hopos.lease_ttl=30

# --- Tijd -----------------------------------------------------------------
# Hop doet pas mee met een gezette klok. Zonder: pool.ntp.org.
#hopos.ntp=192.168.1.1

# --- Diagnose -------------------------------------------------------------
# Elke seconde een regel HOPOS_TICK op de console:
#hopos.tick=1
# Sleutels van één board (hopos.smc, hopos.disk, hopos.pstate, hopos.cores):
# docs/boards-*.md.
