[package]
name = "abi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Het contract tussen kern en app: layout, ringen, control-page, system-API. ABI-versie 1 van HopOS v3."

[dependencies]
dev = { path = "../dev" }
bounded = { path = "../bounded" }
# SHA-256 voor DRBG, hopfs en flip (src/sha256.rs): de ene van Lean.
leancrypto = { git = "https://github.com/xinix00/lean.git", tag = "v3.1.14" }

[lints]
workspace = true

[features]
default = []
# Het glas (src/glass.rs): de FB_*-env, de pixelregel, de invoerstroom.
gui = []
# Het media-vlak (src/hopabi/codec.rs, src/hopabi/device.rs): de payloads
# van de codec-ops en van de optische drive.
media = []
