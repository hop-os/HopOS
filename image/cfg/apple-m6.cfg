# --- Cores, Mac mini M6 (t8152): de indeling is nog niet gemeten ----------
# Geen hopos.system.core: de kern blijft op de core waar iBoot hem afzet.
# Een core die de kern zelf opbrengt, kreeg op de M4 geen timer-FIQ, en een
# gepinde core die niet bestaat is fataal (board/src/lib.rs os_core). Zet hem
# pas na de eerste boot, met de regel "adt: ... cores (E + M + P)".
#hopos.system.core=small
hopos.system.sharegroup=system
hopos.hop.sharegroup=hop
hopos.hop.coreclass=small
#hopos.hop.core=0
# --- Wat op de M6 nog niet gemeten is, staat standaard dicht ---------------
# (board/apple/src/chip.rs `measured`): de schijf, de p-states, de SMC.
#hopos.disk=on
#hopos.pstate=5,6
#hopos.smc=1
# De NIC: zolang chip.rs geen ethernet-tabel heeft, meldt de probe de
# APCIe uit de ADT (HOPOS_APCIE_SURVEY) en start er geen. Daarna:
#hopos.apcie=t8142
#hopos.nic=off
