[package]
name = "board-apple"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "De Mac mini M4 (Apple t8132) achter m1n1 of als eigen bootobject: boot_args en de ADT, de AIC, de dockchannel, de APCIe met de tg3, de ANS-NVMe en de SMC."

[dependencies]
dev = { path = "../../dev" }
abi = { path = "../../abi" }
cpu = { path = "../../cpu" }
fw = { path = "../../fw" }
sync = { path = "../../sync" }
executor = { path = "../../executor" }
netdev = { path = "../../netdev" }
board = { path = "../../board" }
driver-aic = { path = "../../driver/aic" }
driver-dvfs = { path = "../../driver/dvfs" }
driver-pcie = { path = "../../driver/pcie" }
driver-tg3 = { path = "../../driver/nic/tg3" }
driver-rtl8126 = { path = "../../driver/nic/rtl8126", optional = true }
driver-rtkit = { path = "../../driver/rtkit" }
driver-smc = { path = "../../driver/smc" }
driver-nvme = { path = "../../driver/nvme" }

[features]
# De Mac mini M6 (Apple t8152, Mac18,5): de chip-tabel van `chip.rs`, de
# Realtek RTL8125 als NIC (`nic.rs`), en de recepten die alleen op de t8132
# gemeten zijn (p-states, SMC, schijf) standaard dicht. Zonder deze feature
# is het crate de M4, ongewijzigd.
t8152 = ["dep:driver-rtl8126"]

[lints]
workspace = true
