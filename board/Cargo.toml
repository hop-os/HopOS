[package]
name = "board"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Het board-contract: wat een machine moet kunnen (cores, geheugen, NIC, console, klok, slaap)."

[dependencies]
heap = { path = "../heap" }
dev = { path = "../dev" }
abi = { path = "../abi" }
# De heap-grenzen van het linkscript (`Board::init_heap`).
cpu = { path = "../cpu" }
netdev = { path = "../netdev" }
executor = { path = "../executor" }
sync = { path = "../sync" }
# De beschrijving van een framebuffer (`Board::framebuffer`, feature `gui`);
# de console zelf linkt alleen de binary.
driver-fb = { path = "../driver/fb", optional = true }
# De lijst van `Board::usb_hosts` (feature `usb`): begrensd, zonder heap.
bounded = { path = "../bounded", optional = true }
# Het blokcontract van `NoDisk`, de schijf van een board zonder schijf.
blkdev = { path = "../blkdev" }
# De lezer van `hopos.cfg` (`Board::boot_param`): één parser voor elk
# kanaal.
fw = { path = "../fw" }
# De knop van het klokbeleid (`ClockKnob`): de trait en het niveau.
driver-dvfs = { path = "../driver/dvfs" }

[lints]
workspace = true

[features]
default = []
# Het scherm (`Board::framebuffer`): alleen de gui-smaak.
gui = ["dep:driver-fb"]
# De USB-hosts (`Board::usb_hosts`): de bouwsteen van gui en media.
usb = ["dep:bounded"]
