[package]
name = "board-raspi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Het gedeelde Pi-deel (Pi 4 en Pi 5): DTB-boot, geheugenkaart, plan, cmdline-config, mailbox, GIC-400, de Board-implementatie."

[dependencies]
dev = { path = "../../dev" }
abi = { path = "../../abi" }
cpu = { path = "../../cpu" }
fw = { path = "../../fw" }
sync = { path = "../../sync" }
bounded = { path = "../../bounded" }
executor = { path = "../../executor" }
netdev = { path = "../../netdev" }
board = { path = "../../board" }
driver-pl011 = { path = "../../driver/pl011" }
driver-gicv2 = { path = "../../driver/gicv2" }
driver-vcmail = { path = "../../driver/vcmail" }
# De RNG200, de hardware-entropie van de DRBG (rng.rs).
driver-rng200 = { path = "../../driver/rng200" }
# Het contract van de klokknop (clock.rs); het beleid draait in de binary.
driver-dvfs = { path = "../../driver/dvfs" }
# De framebuffer-beschrijving van `Board::framebuffer` (vcfb.rs, `gui`).
driver-fb = { path = "../../driver/fb", optional = true }

[lints]
workspace = true

[features]
default = []
# De framebuffer via de VideoCore (vcfb.rs): alleen de gui-smaak ontdekt
# en mapt hem; kaal gebouwd is het board headless (docs/gui.md).
gui = ["board/gui", "dep:driver-fb"]
# Het USB-DMA-stuk en de VL805-handshake (usb.rs): de bouwsteen van gui
# en media.
usb = ["board/usb"]
